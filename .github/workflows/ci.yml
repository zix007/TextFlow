name: Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore TextFlow.sln

    - name: Build Solution
      run: dotnet build TextFlow.sln -c Release --no-restore

    - name: Run Unit Tests
      run: dotnet test tests/TextFlow.Tests/TextFlow.Tests.csproj -c Release --no-build --verbosity normal

    - name: Publish Standalone Release (win-x64)
      run: dotnet publish src/TextFlow/TextFlow.csproj -c Release -r win-x64 -p:PublishProfile=win-x64

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TextFlow-win-x64
        path: src/TextFlow/bin/Release/net9.0-windows10.0.26100.0/win-x64/publish/
        if-no-files-found: error
